<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>News & Updates | ICO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hijri-date/lib/hijri-date.js"></script>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
    body { background:#f8f9fa; color:#222; }
    header { background: linear-gradient(to right, #065f46, #10b981); color:white; display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; position:sticky; top:0; z-index:1000; }
    .logo-img { height:60px; width:auto; }
    nav ul { list-style:none; display:flex; gap:1.2rem; }
    nav a { color:white; text-decoration:none; font-weight:600; }
    nav a:hover { color:#ffe79a; }
    .menu-toggle { display:none; font-size:1.6rem; cursor:pointer; background:none; border:none; color:white; }
    @media(max-width:768px){ nav ul{ display:none; flex-direction:column; background:#065f46; position:absolute; top:70px; right:20px; padding:1rem; border-radius:8px;} nav ul.show{display:flex;} .menu-toggle{display:block;} }
    .hero { background:url('assets/images/news-hero.jpg') center/cover no-repeat; height:40vh; display:flex; align-items:center; justify-content:center; text-align:center; color:white; }
    .hero h1 { background:rgba(0,0,0,0.5); padding:1rem 2rem; border-radius:10px; font-size:2.5rem; }
    .section { max-width:1100px; margin:3rem auto; padding:0 1.5rem; }
    .section h2 { color:#065f46; text-align:center; margin-bottom:1.5rem; }
    .calendar-box { display:flex; justify-content:space-between; background:#ecfdf5; border-radius:8px; padding:1rem 1.5rem; margin-bottom:2rem; box-shadow:0 3px 8px rgba(0,0,0,0.05);}
    .calendar-item { font-size:1.2rem; font-weight:600; color:#065f46; }
    .feed-item { background:white; margin-bottom:2rem; padding:1.5rem; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.05); position:relative; }
    .feed-item h4 { margin-bottom:0.5rem; color:#10b981; }
    .feed-item p { font-size:0.95rem; line-height:1.6; }
    .feed-item small { display:block; margin-bottom:0.6rem; color:#555; }
    .feed-item img { max-width:100%; border-radius:6px; margin-top:0.5rem; }
    .remove-btn { position:absolute; top:6px; right:6px; background:#ef4444; color:white; border:none; padding:0.2rem 0.5rem; border-radius:6px; cursor:pointer; font-weight:600; }
    footer { background:#065f46; color:white; text-align:center; padding:2rem; }
  </style>
</head>
<body>
  <header>
    <a href="index.html"><img src="a.jpg" alt="ICO Logo" class="logo-img"/></a>
    <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
    <nav>
      <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="donate.html">Donate</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero"><h1>News & Islamic Calendar</h1></section>

  <section class="section">
    <div class="calendar-box">
      <div class="calendar-item" id="gregorian-date">Loading Gregorian date...</div>
      <div class="calendar-item" id="hijri-date">Loading Hijri date...</div>
    </div>

    <h2>Latest Updates</h2>
    <div id="news-feed"></div>
  </section>

  <footer>&copy; 2025 ICO. All rights reserved.</footer>

  <script>
    document.getElementById("menu-toggle").addEventListener("click", () => {
      document.getElementById("nav-links").classList.toggle("show");
    });

    function updateDates() {
      const today = new Date();
      document.getElementById("gregorian-date").textContent = "Gregorian: " + today.toDateString();
      const hijri = new HijriDate(today);
      document.getElementById("hijri-date").textContent = "Hijri: " + hijri.format('iD iMMMM iYYYY');
    }
    updateDates(); setInterval(updateDates, 60000);

    const backendURL = "https://ico-backend.onrender.com";
    const feedContainer = document.getElementById("news-feed");

    async function loadNews() {
      feedContainer.innerHTML = '';
      try {
        const res = await fetch(`${backendURL}/news`);
        const data = await res.json();
        data.sort((a,b)=>b.date - a.date); // newest first
        data.forEach(item => {
          const div = document.createElement('div');
          div.className = 'feed-item';
          div.innerHTML = `
            <h4>${item.title}</h4>
            <small>${new Date(item.date).toLocaleString()}</small>
            <p>${item.content}</p>
            ${item.image ? `<img src="${backendURL}/${item.image}" alt="news image"/>` : ''}
          `;
          feedContainer.appendChild(div);
        });
      } catch(err) {
        console.error(err);
        feedContainer.innerHTML = '<p style="text-align:center; color:red;">Failed to load news.</p>';
      }
    }

    loadNews();
  </script>
  
<script>
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('keydown', e=>{
  if(e.keyCode===123||(e.ctrlKey&&e.shiftKey&&(e.keyCode===73||e.keyCode===74))||(e.ctrlKey&&(e.keyCode===85||e.keyCode===83))){
    e.preventDefault();
    alert('Viewing source code is disabled on this page.');
  }
});
</script>
</body>
</html>
